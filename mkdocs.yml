site_name: VampireXRAY Blog
site_description: Just My Articles
site_author: ReemKhalid
site_url: https://x-ray2004.github.io/My-Blog/

theme:
  name: material
  language: en
  direction: ltr
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
  font:
    text: Cairo
    code: Roboto Mono
  icon:
    logo: material/bat
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes        # يخلي صفحة "Overview" هي index لكل قسم بشكل صحيح
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow                # الـTOC يتحرك مع القراءة زي المدونة اللي بعتيها

nav:
  - Home: index.md
  - CVE Analysis: cve/index.md
  - Summaries:
      - Overview: books/index.md
      - SansSEC450-Notes:
          - Overview: books/SansSEC450-Notes/index.md
          - Chapter 1: books/SansSEC450-Notes/chapter-1.md
          - Chapter 2: books/SansSEC450-Notes/chapter-2.md
          - Chapter 3: books/SansSEC450-Notes/chapter-3.md
          - Chapter 4: books/SansSEC450-Notes/chapter-4.md
          - Chapter 5: books/SansSEC450-Notes/chapter-5.md
      - Cloud Fundamentals AWS:
          - Overview: books/cloud/index.md
          - Chapter 1: books/cloud/chapter-1.md
          - Chapter 2: books/cloud/chapter-2.md
          - Chapter 3: books/cloud/chapter-3.md
          - Chapter 4: books/cloud/chapter-4.md
          - Chapter 5: books/cloud/chapter-5.md
          - Chapter 6: books/cloud/chapter-6.md
          - Chapter 7: books/cloud/chapter-7.md
          - Chapter 8: books/cloud/chapter-8.md
          - Chapter 9: books/cloud/chapter-9.md
          - Chapter 10: books/cloud/chapter-10.md
  - SOC Reports: soc/index.md
  - CTF Writeups: ctf/index.md
  - Other: other/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/twitter
      link: https://x.com/VampireXray
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/reem-khalid-818b83250/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@VampireXRay/playlists

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/bat-cursor.js

plugins:
  - search
  - blog:
      blog_dir: cve
      archive: false
      blog_toc: false
      post_readtime: true
      post_date_format: full
      pagination_per_page: 5
  - blog:
      blog_dir: books
      archive: false
      blog_toc: false
      post_readtime: true
      post_date_format: full
      pagination_per_page: 5
  - blog:
      blog_dir: soc
      archive: false
      blog_toc: false
      post_readtime: true
      post_date_format: full
      pagination_per_page: 5
  - blog:
      blog_dir: ctf
      archive: false
      blog_toc: false
      post_readtime: true
      post_date_format: full
      pagination_per_page: 5
  - blog:
      blog_dir: other
      archive: false
      blog_toc: false
      post_readtime: true
      post_date_format: full
      pagination_per_page: 5
  - git-revision-date-localized:
      type: date
      locale: en
      fallback_to_build_date: true
  - glightbox        # lightbox للصور/screenshots في تقارير الـCTF والـSOC